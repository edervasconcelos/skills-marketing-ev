<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Skills e Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9; --bg2:#f4f3f1; --panel:#ffffff; --ink:#0c0a09; --ink2:#44403c; --muted:#78716c; --line:#e7e5e4; --line2:#d6d3d1;
  --accent:#e10600; --accent2:#ff5a36; --accent-soft:#fff1ef; --accent-ink:#b30500; --glow:rgba(225,6,0,.16);
  --chip:#f5f5f4; --warn-bg:#fff7ed; --warn-ink:#9a3412; --ok:#15803d; --adapt:#b45309;
  --shadow:0 1px 2px rgba(12,10,9,.04),0 8px 24px -12px rgba(12,10,9,.10);
  --shadow-hi:0 1px 2px rgba(12,10,9,.06),0 18px 40px -18px rgba(225,6,0,.28);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.099 24.5%,1.105,1.104 28.5%,1.074 33.6%,1.019 41.4%,.996 45.5%,.987 51.1%,1.001 66.6%,1);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0a09; --bg2:#110e0d; --panel:#161312; --ink:#fafaf9; --ink2:#d6d3d1; --muted:#a8a29e; --line:#292524; --line2:#3a3431;
  --accent:#ff2d22; --accent2:#ff7a52; --accent-soft:#2a1210; --accent-ink:#ff8a7e; --glow:rgba(255,45,34,.22);
  --chip:#1f1b19; --warn-bg:#2b1d0e; --warn-ink:#fdba74; --ok:#4ade80; --adapt:#fbbf24;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-hi:0 1px 0 rgba(255,255,255,.05) inset,0 18px 44px -18px rgba(255,45,34,.45);}}
:root[data-theme="dark"]{
  --bg:#0c0a09; --bg2:#110e0d; --panel:#161312; --ink:#fafaf9; --ink2:#d6d3d1; --muted:#a8a29e; --line:#292524; --line2:#3a3431;
  --accent:#ff2d22; --accent2:#ff7a52; --accent-soft:#2a1210; --accent-ink:#ff8a7e; --glow:rgba(255,45,34,.22);
  --chip:#1f1b19; --warn-bg:#2b1d0e; --warn-ink:#fdba74; --ok:#4ade80; --adapt:#fbbf24;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-hi:0 1px 0 rgba(255,255,255,.05) inset,0 18px 44px -18px rgba(255,45,34,.45);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Geist,ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono,code,.path{font-family:"Geist Mono",ui-monospace,monospace}
::selection{background:var(--accent);color:#fff}

/* ---------- topo ---------- */
header{position:relative;padding:18px 24px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow:hidden;flex:none}
header::before{content:"";position:absolute;inset:-120px auto auto -80px;width:520px;height:300px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
header::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(100deg,#000 0%,transparent 55%);opacity:.5;pointer-events:none}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font:700 15px Geist;box-shadow:0 6px 18px -6px var(--accent)}
h1{margin:0;font-size:21px;letter-spacing:-.025em;font-weight:700}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--muted);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:999px;padding:3px 10px;backdrop-filter:blur(6px)}
.stat b{color:var(--ink);font-weight:600}
.stat.warn b{color:var(--warn-ink)}
.acoes{margin-left:auto;display:flex;gap:8px}
.btn{font:500 13px Geist;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform 160ms var(--ease-out),border-color 160ms ease,background 160ms ease}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--line2);background:var(--bg2)}}
.btn svg{width:15px;height:15px}
.busca-wrap{position:relative;z-index:1;margin-top:14px;display:flex;gap:10px;align-items:center}
.busca{position:relative;flex:1;min-width:0}
.busca svg{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.busca input{width:100%;font:inherit;font-size:14.5px;padding:11px 84px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);transition:border-color 160ms ease,box-shadow 200ms var(--ease-out)}
.busca input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.kbd span{font:500 11px "Geist Mono";color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--panel)}
#qtd{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:88px;text-align:right}
#qtd b{color:var(--ink);font-variant-numeric:tabular-nums}
/* chips de categoria com indicador deslizante */
.cats{position:relative;z-index:1;display:flex;gap:4px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.pill{position:absolute;top:12px;left:0;height:30px;border-radius:999px;background:var(--ink);transition:transform 420ms var(--spring),width 420ms var(--spring);z-index:0}
.cat{position:relative;z-index:1;flex:none;font:500 12.5px Geist;color:var(--muted);background:none;border:0;border-radius:999px;padding:0 12px;height:30px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color 200ms ease}
.cat i{font-style:normal;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.cat .cd{width:7px;height:7px;border-radius:50%}
.cat.on{color:var(--bg)}
@media (hover:hover) and (pointer:fine){.cat:not(.on):hover{color:var(--ink)}}

/* ---------- corpo ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(320px,430px) 1fr;min-height:0}
#lista{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:6px 10px 20px;scroll-behavior:smooth}
.grupo{position:relative}
.letra{position:sticky;top:-6px;z-index:2;font:600 11px "Geist Mono";letter-spacing:.12em;color:var(--accent);padding:12px 10px 6px;margin:0 -10px;padding-left:20px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.item{position:relative;display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:inherit;font:inherit;padding:11px 12px 11px 14px;margin:2px 0;border-radius:12px;cursor:pointer;overflow:hidden;isolation:isolate;transition:transform 160ms var(--ease-out),border-color 200ms ease,background 200ms ease}
.item:active{transform:scale(.985)}
.item::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);transition:opacity 220ms ease}
@media (hover:hover) and (pointer:fine){.item:hover{border-color:var(--line)}.item:hover::before{opacity:1}}
.item.ativo{border-color:transparent;background:var(--accent-soft)}
.item.ativo::after{content:"";position:absolute;inset:0;border-radius:12px;padding:1px;background:linear-gradient(120deg,var(--accent),var(--accent2),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.item.foco{outline:2px solid var(--accent);outline-offset:-2px}
.item .nome{font:500 13.5px "Geist Mono";display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.item .nome .cd{width:7px;height:7px;border-radius:50%;flex:none}
.item .bugdot{margin-left:auto;font:600 10px Geist;color:var(--warn-ink);background:var(--warn-bg);border-radius:999px;padding:1px 7px;letter-spacing:.02em}
.item .resumo{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .autor{font-size:11px;color:var(--muted);opacity:.8;margin-top:5px}
.entra .item{animation:surgir 380ms var(--ease-out) both;animation-delay:calc(min(var(--i),14) * 28ms)}
@keyframes surgir{from{opacity:0;transform:translateY(6px)}}
.vazio-lista{padding:40px 16px;text-align:center;color:var(--muted)}

#detalhe{position:relative;overflow:auto;padding:0 40px 80px;background:var(--bg)}
#progresso{position:sticky;top:0;left:0;height:2px;margin:0 -40px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:0 50%;transform:scaleX(0);z-index:5}
.boas-vindas{min-height:calc(100% - 2px);display:grid;place-items:center;text-align:center;padding:40px 0}
.boas-vindas .orb{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 20px 50px -18px var(--accent);display:grid;place-items:center;color:#fff;animation:flutuar 5s var(--ease-io) infinite alternate}
.boas-vindas .orb svg{width:38px;height:38px}
@keyframes flutuar{to{transform:translateY(-8px) rotate(-3deg)}}
.boas-vindas h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.boas-vindas p{margin:0 auto;color:var(--muted);max-width:420px}
.atalhos{margin-top:18px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.atalhos span b{font:500 11px "Geist Mono";border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--ink2);background:var(--panel)}

.det{max-width:920px;margin:0 auto;padding-top:28px}
.det.entra > *{animation:revelar 340ms var(--ease-out) both;animation-delay:calc(var(--k,0) * 45ms)}
@keyframes revelar{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.voltar{display:none}
.hero{position:relative;border:1px solid var(--line);border-radius:20px;padding:26px 28px 22px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.hero::before{content:"";position:absolute;inset:-60% -10% auto auto;width:420px;height:320px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero .catlinha{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.hero .catb{font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px;display:inline-flex;align-items:center;gap:6px}
.hero .catb .cd{width:7px;height:7px;border-radius:50%}
.hero h2{position:relative;font:600 clamp(22px,3vw,30px)/1.15 "Geist Mono";letter-spacing:-.035em;margin:0 0 6px;word-break:break-word}
.origem{position:relative;font-size:12px;color:var(--muted)}
.origem b{color:var(--ink2);font-weight:600}
.origem .inf{opacity:.75}
.hero .resumo{position:relative;font-size:17.5px;line-height:1.5;margin:16px 0 18px;color:var(--ink);max-width:62ch;text-wrap:pretty}
.hero .barra{position:relative;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.prim{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (hover:hover) and (pointer:fine){.btn.prim:hover{background:var(--ink);opacity:.9}}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tag{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--muted)}

.alerta{display:flex;gap:12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn-ink) 25%,transparent)}
.alerta svg{flex:none;width:18px;height:18px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid2 .card{margin-bottom:0}
.card h3{margin:0 0 12px;font:600 11px "Geist Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 svg{width:14px;height:14px;color:var(--accent)}
.card p{margin:0 0 8px;color:var(--ink2)}
.card p:last-child{margin-bottom:0}
.suave{color:var(--muted);font-size:14px}

/* combos */
.combo{background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--accent),var(--accent2) 40%,var(--line) 75%) border-box;border:1px solid transparent}
.combo .intro{font-size:14px;color:var(--muted);margin:-4px 0 12px}
.cbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
a.cb{position:relative;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 36px 12px 14px;background:var(--bg);overflow:hidden;isolation:isolate;transition:transform 220ms var(--ease-out),border-color 200ms ease,box-shadow 220ms var(--ease-out)}
a.cb::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);transition:opacity 220ms ease}
a.cb b{font:500 12.5px "Geist Mono";color:var(--accent-ink);word-break:break-all}
a.cb span{font-size:13.5px;color:var(--ink2);line-height:1.45}
a.cb svg{position:absolute;right:12px;top:13px;width:16px;height:16px;color:var(--muted);transition:transform 220ms var(--ease-out),color 200ms ease}
a.cb:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){a.cb:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow-hi)}a.cb:hover::before{opacity:1}a.cb:hover svg{transform:translate(2px,-2px);color:var(--accent)}}

.gat{display:flex;flex-wrap:wrap;gap:6px}
.gat span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.gat span::before{content:"“";color:var(--accent);margin-right:1px}
.gat span::after{content:"”";color:var(--accent);margin-left:1px}
ol.sec{margin:0;padding:0;list-style:none;counter-reset:s;columns:2;column-gap:28px}
ol.sec li{counter-increment:s;break-inside:avoid;font-size:14px;margin-bottom:7px;display:flex;gap:10px;color:var(--ink2)}
ol.sec li::before{content:counter(s,decimal-leading-zero);font:500 11px "Geist Mono";color:var(--accent);padding-top:3px;flex:none}
.como{display:grid;gap:8px}
.como > div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink2)}
.como b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
code{font-size:12.5px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all;color:var(--ink)}
.path{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;word-break:break-all}
.path button{margin-left:auto;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:6px;display:grid;place-items:center;transition:transform 160ms var(--ease-out),color 160ms ease}
.path button:active{transform:scale(.9)}
.path button svg{width:15px;height:15px}
@media (hover:hover) and (pointer:fine){.path button:hover{color:var(--accent)}}
.ias{display:grid;gap:8px}
.ia{display:grid;grid-template-columns:22px minmax(130px,34%) 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.ia .st{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.ia .st svg{width:13px;height:13px}
.ia.sim .st{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.ia.adapt .st{background:color-mix(in srgb,var(--adapt) 15%,transparent);color:var(--adapt)}
.ia b{font-weight:600}
.ia span{color:var(--ink2)}
.legenda{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legenda i{font-style:normal;font-weight:700}

/* guia: qual skill usar */
.guia{max-width:860px;margin:0 auto;padding:40px 0 20px}
.guia-top{text-align:center;margin-bottom:22px}
.guia-top .orb{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 20px 50px -18px var(--accent);display:grid;place-items:center;color:#fff;animation:flutuar 5s var(--ease-io) infinite alternate}
.guia-top .orb svg{width:30px;height:30px}
.guia-top h2{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
.guia-top p{margin:0 auto;color:var(--muted);max-width:520px}
.caixa{position:relative;border-radius:18px;padding:1px;background:linear-gradient(120deg,var(--accent),var(--accent2) 35%,var(--line) 70%);box-shadow:var(--shadow-hi)}
.caixa textarea{display:block;width:100%;min-height:104px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;padding:16px 18px 52px;border:0;border-radius:17px;background:var(--panel);color:var(--ink)}
.caixa textarea:focus{outline:none}
.caixa .rodape{position:absolute;left:14px;right:12px;bottom:10px;display:flex;align-items:center;gap:10px}
.caixa .dica{font-size:12px;color:var(--muted)}
.caixa .btn{margin-left:auto}
.exemplos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 0}
.ex{font:500 12.5px Geist;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:transform 160ms var(--ease-out),border-color 160ms ease}
.ex:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.ex:hover{border-color:var(--accent)}}
.recs{margin-top:26px}
.recs-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.recs-h h3{margin:0;font:600 11px "Geist Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recs-h span{font-size:12.5px;color:var(--muted)}
.rec{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:4px 14px;align-items:start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;overflow:hidden;isolation:isolate;transition:transform 220ms var(--ease-out),border-color 200ms ease,box-shadow 220ms var(--ease-out)}
.rec::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);transition:opacity 220ms ease}
.rec:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.rec:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow-hi)}.rec:hover::before{opacity:1}}
.rec .pos{grid-row:span 3;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:600 13px "Geist Mono";background:var(--chip);color:var(--muted)}
.rec.top{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--accent),var(--accent2) 45%,var(--line) 80%) border-box}
.rec.top .pos{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.rec .nm{font:500 14px "Geist Mono";display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec .nm .cd{width:7px;height:7px;border-radius:50%}
.rec .nm .melhor{font:600 10.5px Geist;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.rec .rs{font-size:14px;color:var(--ink2);grid-column:2}

            : "Skills são capacidades específicas que o agente carrega quando precisa. Escolha uma na lista para ver a descrição completa, o combo e onde está salva."}</p>
    <button class="btn prim atalho-guia" type="button" id="ir-guia">${ICO_GUIA}Não sabe qual? Descreva o que precisa</button>
    <div class="atalhos"><span><b>Ctrl K</b>buscar</span><span><b>↑ ↓</b>navegar</span><span><b>Enter</b>abrir</span><span><b>Esc</b>limpar</span></div>
  </div></div>`;
  $("#ir-guia").addEventListener("click", () => irPara("inicio", { foco: true }));
}
$("#abrir-guia").addEventListener("click", () => { irPara("inicio", { foco: true }); $("#detalhe").scrollTop = 0; progresso(); });
function bloco(icone, titulo, corpo, extra = ""){
  return `<div class="card ${extra}"><h3>${ICO[icone]}${titulo}</h3>${corpo}</div>`;
}
function abrir(n, k, push = true, animar = true){
  k = k || (modo === "agente" ? "agente" : "skill");
  const i = D.itens.find(x => x.n === n && x.k === k) || D.itens.find(x => x.n === n); if (!i) return;
  if (modo !== i.k) irPara(i.k, { semPainel: true });
  if (i.k === "agente") return abrirAgente(i, push, animar);
  atual = n;
  document.querySelectorAll(".item").forEach(b => b.classList.toggle("ativo", b.dataset.n === n));
  const linhas = (arr, cls) => arr.map(([a, b]) => `<div class="ia ${cls}"><span class="st">${cls === "sim" ? ICO.ok : ICO.meio}</span><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
  const noClaude = i.nat.some(([a]) => a.startsWith("Claude"));
  const partes = [];
  partes.push(`<button class="btn voltar" type="button" onclick="fechar()">← Voltar à lista</button>`);
  partes.push(`<div class="hero">
    <div class="catlinha"><span class="catb"><span class="cd" style="background:${corCat[i.cat]}"></span>${esc(i.cat)}</span>${i.t ? `<span>Título interno: ${esc(i.t)}</span>` : ""}</div>
    <h2>${esc(i.n)}</h2>
    <div class="origem" title="${i.reg ? "Origem registrada neste computador" : "Origem deduzida: não há registro local"}">por <b>${esc(i.cr)}</b> · ${esc(i.or)}${i.reg ? "" : ' <span class="inf">(sem registro)</span>'}</div>
    <p class="resumo">${esc(i.r)}</p>
    <div class="barra">
      ${i.dl ? `<button class="btn prim" type="button" data-copiar="${esc(i.dl.cmd)}">${ICO.copiar}Copiar comando de instalação</button>`
             : `<button class="btn prim" type="button" data-copiar="/${esc(i.n)}">${ICO.copiar}${i.n.length > 26 ? "Copiar comando" : "Copiar /" + esc(i.n)}</button>`}
      <div class="tags">${i.tipos.map(t => `<span class="tag">${esc(t)}</span>`).join("")}${i.en ? '<span class="tag" title="O arquivo SKILL.md está em inglês; os textos desta página foram traduzidos.">Original em inglês, traduzido</span>' : ""}</div>
    </div></div>`);
  if (i.bug) partes.push(`<div class="alerta">${ICO.alerta}<div><b>Cabeçalho com defeito.</b> No SKILL.md, o campo <code>description</code> contém só "name: …" em vez da descrição. Os agentes usam esse campo para decidir quando acionar a skill, então ela não é acionada automaticamente; só funciona chamada pelo nome. A descrição abaixo foi recuperada do corpo do arquivo.</div></div>`);
  if (i.dl) partes.push(bloco("baixar", i.dl.zip ? "Baixar e instalar" : "Instalar do autor original", `<div class="como">
      <div><b>No Claude Code, Codex, Gemini CLI ou Cursor (terminal)</b><div class="path"><span>${esc(i.dl.cmd)}</span><button type="button" data-copiar="${esc(i.dl.cmd)}" title="Copiar comando" aria-label="Copiar comando">${ICO.copiar}</button></div></div>
      ${i.dl.zip ? `<div><b>Sem terminal</b>Baixe o .zip, descompacte e coloque a pasta em <code>~/.claude/skills/</code> (Claude Code) ou <code>~/.agents/skills/</code> (outras IAs).</div>` : `<div><b>Origem</b>Skill de outro autor. O comando instala direto do repositório original, sempre na versão mais nova.</div>`}
    </div><div class="barra-dl">${i.dl.zip ? `<a class="btn prim" href="${esc(i.dl.zip)}" download>${ICO.baixar}Baixar .zip</a>` : ""}<a class="btn" href="${esc(i.dl.repo)}" target="_blank" rel="noopener">${ICO.seta}Ver no GitHub</a></div>`, "combo"));
  if (i.cb.length) partes.push(bloco("combo", "Combo: use junto para potencializar",
    `<p class="intro">Para tirar mais desta skill, combine com:</p><div class="cbs">${i.cb.map(c => `<a class="cb" href="#skill/${encodeURIComponent(c.s)}"><b>${esc(c.s)}</b><span>${esc(c.w)}</span>${ICO.seta}</a>`).join("")}</div>`, "combo"));
  partes.push(bloco("doc", "Descrição completa", `<p>${esc(i.d) || "Sem descrição no cabeçalho."}</p>`));
  const obj = i.o ? bloco("alvo", "Objetivo", `<p>${esc(i.o)}</p>`) : "";
  const uso = bloco("play", "Aplicação: quando e como usar", `${i.q ? `<p>${esc(i.q)}</p>` : ""}<div class="como">
      ${noClaude ? `<div><b>Chamar direto no Claude Code</b><code>/${esc(i.n)}</code></div>`
        : `<div><b>Claude Code</b>Ainda não disponível: a skill está só na pasta <code>.agents</code>. Copie a pasta para <code>~/.claude/skills/</code> para chamar com <code>/${esc(i.n)}</code>.</div>`}
      <div><b>Acionamento automático</b>Descreva a tarefa com palavras parecidas com as da descrição; o agente escolhe a skill sozinho.</div>
      <div><b>No Codex, Gemini CLI ou Cursor</b>Mencione o nome da skill no pedido (ex.: "use a skill ${esc(i.n)}").</div></div>`);
  partes.push(obj ? `<div class="grid2">${obj}${uso}</div>` : uso);
  if (obj) partes.push(`<div style="height:16px"></div>`);
  if (i.g.length) partes.push(bloco("fala", "Casos de uso: frases que acionam a skill", `<div class="gat">${i.g.map(g => `<span>${esc(g)}</span>`).join("")}</div>`));
  if (i.sec.length) partes.push(bloco("lista", "O que a skill faz, etapa por etapa", `<ol class="sec">${i.sec.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`));
  partes.push(bloco("pasta", D.pub ? "Origem dos arquivos" : "Onde está salva", `${i.loc.map(l => `<div class="path"><span>${esc(l)}</span>${l.includes("/") ? `<button type="button" data-copiar="${esc(l)}" title="Copiar caminho" aria-label="Copiar caminho">${ICO.copiar}</button>` : ""}</div>`).join("")}
      ${i.narq ? `<p class="suave">${i.narq} arquivo(s)${i.pastas.length ? " · subpastas: " + i.pastas.map(esc).join(", ") : ""}</p>` : ""}
      ${i.rec.length ? `<p class="suave">Depende de: ${i.rec.map(esc).join(", ")}</p>` : ""}`));
  partes.push(bloco("ia", "Quais agentes e IAs podem usar", `<div class="ias">${linhas(i.nat, "sim")}${linhas(i.via, "adapt")}</div>
      <div class="legenda"><span><i style="color:var(--ok)">✓</i> funciona direto no local onde está salva</span><span><i style="color:var(--adapt)">–</i> funciona com adaptação</span></div>`));
  const det = document.createElement("div");
  det.className = "det" + (animar && !reduz ? " entra" : "");
  det.innerHTML = partes.join("");
  [...det.children].forEach((el, k) => el.style.setProperty("--k", Math.min(k, 8)));
  $("#conteudo").replaceChildren(det);
  $("#detalhe").scrollTop = 0; progresso();
  document.body.classList.add("aberto");
  if (push) history.replaceState(null, "", "#skill/" + encodeURIComponent(n));
}
function mostrar(partes, animar){
  const det = document.createElement("div");
  det.className = "det" + (animar && !reduz ? " entra" : "");
  det.innerHTML = partes.join("");
  [...det.children].forEach((el, k) => el.style.setProperty("--k", Math.min(k, 8)));
  $("#conteudo").replaceChildren(det);
  $("#detalhe").scrollTop = 0; progresso();
  document.body.classList.add("aberto");
}
function abrirAgente(i, push, animar){
  atual = i.n;
  document.querySelectorAll(".item").forEach(b => b.classList.toggle("ativo", b.dataset.n === i.n));
  const linhas = (arr, cls) => arr.map(([a, b]) => `<div class="ia ${cls}"><span class="st">${cls === "sim" ? ICO.ok : ICO.meio}</span><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
  const sk = i.cb.filter(c => !c.ag), ags = i.cb.filter(c => c.ag);
  const nomeAg = s => (D.itens.find(x => x.k === "agente" && x.n === s) || {}).t || s;
  const cartao = c => c.x === false
    ? `<div class="cb fora"><b>${esc(c.s)}</b><span>${esc(c.w)}</span></div>`
    : `<a class="cb${c.ag ? " ag" : ""}" href="#${c.ag ? "agente" : "skill"}/${encodeURIComponent(c.s)}"><b>${esc(c.ag ? nomeAg(c.s) : c.s)}</b><span>${esc(c.w)}</span>${ICO.seta}</a>`;
  const partes = [];
  partes.push(`<button class="btn voltar" type="button" onclick="fechar()">← Voltar à lista</button>`);
  partes.push(`<div class="hero">
    <div class="catlinha"><span class="catb"><span class="cd" style="background:${corCat[i.cat]}"></span>${esc(i.cat)}</span><span class="tipo-b agente" style="margin-left:0">agente</span></div>
    <h2 class="h-ag">${esc(i.t)}</h2>
    <div class="slug">${esc(i.n)}</div>
    <div class="origem" title="${i.reg ? "Origem registrada neste computador" : "Origem deduzida: não há registro local"}">por <b>${esc(i.cr)}</b> · ${esc(i.or)}</div>
    <p class="resumo">${esc(i.r)}</p>
    <div class="barra">
      <button class="btn prim" type="button" data-copiar="${esc(i.cmd)}">${ICO.copiar}${i.cmd.startsWith("/") ? "Copiar " + esc(i.cmd) : "Copiar pedido de acionamento"}</button>
      <div class="tags">${i.tipos.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div></div>`);
  if (sk.length) partes.push(bloco("combo", "Skills que este agente usa",
    `<p class="intro">O agente carrega estas skills para executar o trabalho:</p><div class="cbs">${sk.map(cartao).join("")}</div>`, "combo"));
  partes.push(bloco("doc", "O que este agente faz", `<p>${esc(i.d)}</p>`));
  const obj = i.o && i.o !== i.d ? bloco("alvo", "Objetivo", `<p>${esc(i.o)}</p>`) : "";
  const uso = bloco("play", "Quando acionar", `<p>${esc(i.q)}</p><div class="como"><div><b>Pedido para copiar</b><code>${esc(i.cmd)}</code></div></div>`);
  partes.push(obj ? `<div class="grid2">${obj}${uso}</div>` : uso);
  if (obj) partes.push(`<div style="height:16px"></div>`);
  const loop = !!i.gChips;
  if (i.g.length) partes.push(bloco("fala", i.gT || "Tarefas e responsabilidades", loop
    ? `<div class="gat">${i.g.map(g => `<span>${esc(g)}</span>`).join("")}</div>`
    : `<ol class="sec uma">${i.g.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`));
  const tSec = i.secT || "Como trabalha, passo a passo";
  if (i.sec.length) partes.push(bloco("lista", tSec, `<ol class="sec">${i.sec.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`));
  if (ags.length) partes.push(bloco("ia", "Trabalha junto com", `<div class="cbs">${ags.map(cartao).join("")}</div>`));
  partes.push(bloco("pasta", "Onde está salvo", i.loc.map(l => `<div class="path"><span>${esc(l)}</span>${l.includes("/") ? `<button type="button" data-copiar="${esc(l)}" title="Copiar caminho" aria-label="Copiar caminho">${ICO.copiar}</button>` : ""}</div>`).join("")));
  partes.push(bloco("ia", "Quais IAs podem usar", `<div class="ias">${linhas(i.nat, "sim")}${linhas(i.via, "adapt")}</div>
      <div class="legenda"><span><i style="color:var(--ok)">✓</i> funciona direto</span><span><i style="color:var(--adapt)">–</i> funciona com adaptação</span></div>`));
  mostrar(partes, animar);
  if (push) history.replaceState(null, "", "#agente/" + encodeURIComponent(i.n));
}
function fechar(){ document.body.classList.remove("aberto"); }

/* barra de progresso de leitura */
function progresso(){
  const d = $("#detalhe"), max = d.scrollHeight - d.clientHeight;
  $("#progresso").style.transform = `scaleX(${max > 0 ? d.scrollTop / max : 0})`;
}
$("#detalhe").addEventListener("scroll", progresso, { passive: true });

/* copiar + toast */
let tt;
function toast(msg){
  const t = $("#toast"); t.querySelector("span").textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copiar]"); if (!b) return;
  const txt = b.dataset.copiar;
  try { await navigator.clipboard.writeText(txt); }
  catch(_) { const a = document.createElement("textarea"); a.value = txt; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copiado: " + (txt.length > 42 ? txt.slice(0, 40) + "…" : txt));
});

/* eventos */
$("#lista").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) abrir(b.dataset.n, modo); });
$("#busca").addEventListener("input", () => renderLista(false));
$("#sorte").addEventListener("click", () => {
  const pool = modo === "inicio" ? D.itens : (visiveis.length ? visiveis : daVez());
  const i = pool[Math.floor(Math.random() * pool.length)];
  abrir(i.n, i.k);
  const b = document.querySelector(`.item[data-n="${CSS.escape(i.n)}"]`);
  if (b) b.scrollIntoView({ block: "center", behavior: reduz ? "auto" : "smooth" });
});

/* teclado: sem animação em ações de teclado */
function marcarFoco(k){
  const itens = [...document.querySelectorAll(".item")]; if (!itens.length) return;
  foco = Math.max(0, Math.min(itens.length - 1, k));
  itens.forEach((b, j) => b.classList.toggle("foco", j === foco));
  itens[foco].scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  const busca = $("#busca");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" || (e.key === "/" && document.activeElement !== busca)) {
    e.preventDefault(); busca.focus(); busca.select(); return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (document.activeElement.tagName === "INPUT" || document.activeElement.closest("#lista") || document.activeElement === document.body) {
      e.preventDefault(); marcarFoco(foco + (e.key === "ArrowDown" ? 1 : -1));
    }
  }
  if (e.key === "Enter" && foco >= 0) {
    const b = document.querySelectorAll(".item")[foco]; if (b) { e.preventDefault(); abrir(b.dataset.n, modo, true, false); }
  }
  if (e.key === "Escape") {
    if (document.body.classList.contains("aberto") && innerWidth <= 860) fechar();
    else if (busca.value) { busca.value = ""; renderLista(false); }
  }
});

/* tema */
const root = document.documentElement;
try { const t = localStorage.getItem("mapa-tema"); if (t) root.dataset.theme = t; } catch(e){}
$("#tema").addEventListener("click", () => {
  const escuro = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = escuro ? "light" : "dark";
  try { localStorage.setItem("mapa-tema", root.dataset.theme); } catch(e){}
});

/* início */
irPara("inicio", { manterHash: true });
requestAnimationFrame(() => { moverPill(true); moverPill2(true); });
document.fonts && document.fonts.ready.then(() => { moverPill(true); moverPill2(true); });
function doHash(){
  if (!location.hash) return;
  let n = decodeURIComponent(location.hash.slice(1)), k = "skill";
  const m = n.match(/^(skill|agente)[/](.*)$/); if (m) { k = m[1]; n = m[2]; }
  abrir(n, k, false);
  const b = document.querySelector(`.item[data-n="${CSS.escape(n)}"]`);
  if (b) b.scrollIntoView({ block: "center" });
}
window.addEventListener("hashchange", doHash);
doHash();
</script>
